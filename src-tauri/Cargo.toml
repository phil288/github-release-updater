[package]
name = "gh-release-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tray app that installs new GitHub release .deb/.msi packages"

[lib]
name = "gh_release_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
updater-core = { path = "../crates/updater-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
uuid = { version = "1", features = ["serde"] }

# The default AppIndicator tray backend emits no click events on Linux; KSNI
# (StatusNotifierItem over D-Bus) reports activation, so clicking the icon can
# open the window. tray-icon prefers KSNI when both backends are enabled.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
